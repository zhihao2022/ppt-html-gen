<section class="slide slide-cover bit-slide bit-cover" data-slide-type="cover" data-slide-id="{{slideId}}">
  <div class="bit-cover-mark"></div>
  <div class="bit-cover-frame"></div>
  <div class="bit-cover-content">
    <p class="bit-kicker">{{kicker}}</p>
    <h1 class="bit-cover-title">{{title}}</h1>
    <p class="bit-cover-subtitle">{{subtitle}}</p>
  </div>
  <div class="bit-cover-meta">
    <span>{{author}}</span>
    <span>{{date}}</span>
  </div>
</section>
