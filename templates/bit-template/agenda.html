<section class="slide slide-agenda bit-slide bit-agenda" data-slide-type="agenda" data-slide-id="{{slideId}}">
  <header class="bit-header">
    <div class="bit-page-mark">目录</div>
    <h1 class="bit-slide-title">{{title}}</h1>
  </header>
  <main class="bit-toc-body">
    <ol class="bit-toc-list">
      {{items}}
    </ol>
  </main>
  <footer class="bit-footer">
    <span>{{deckTitle}}</span>
    <span>{{pageNumber}}</span>
  </footer>
</section>
