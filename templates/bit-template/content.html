<section class="slide slide-content bit-slide bit-content" data-slide-type="content" data-slide-id="{{slideId}}">
  <header class="bit-header">
    <div class="bit-page-mark">{{section}}</div>
    <h1 class="bit-slide-title">{{title}}</h1>
  </header>
  <main class="bit-slide-body" data-safe-area>
    {{content}}
  </main>
  <div class="bit-references">
    {{references}}
  </div>
  <footer class="bit-footer">
    <span>{{deckTitle}}</span>
    <span>{{pageNumber}}</span>
  </footer>
</section>
