<section class="slide slide-section bit-slide bit-section" data-slide-type="section" data-slide-id="{{slideId}}">
  <div class="bit-section-number">{{sectionNumberPlain}}</div>
  <div class="bit-section-content">
    <p class="bit-kicker">{{kicker}}</p>
    <h1 class="bit-section-title">{{title}}</h1>
    <p class="bit-section-subtitle">{{subtitle}}</p>
  </div>
  <footer class="bit-footer bit-footer-inverse">
    <span>{{deckTitle}}</span>
    <span>{{pageNumber}}</span>
  </footer>
</section>
