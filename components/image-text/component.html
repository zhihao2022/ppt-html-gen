<div class="component component-image-text component-image-text-{{imagePosition}}">
  <figure>
    <img src="{{image}}" alt="{{imageAlt}}" />
    <figcaption>{{imageCaption}}</figcaption>
  </figure>
  <div class="text-panel">
    <h2>{{textTitle}}</h2>
    <p>{{body}}</p>
    <ul>
      {{bullets}}
    </ul>
  </div>
</div>
